keyStore:
  supportedTypes: PKCS12, JKS

management:
  endpoints:
    jmx:
      exposure:
        exclude: '*'
    web:
      base-path: '/'
      exposure:
        include: health, info

spring:
  datasource:
    url: jdbc:hsqldb:mem:testdb
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.HSQLDialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: public
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

server:
  port: ${PORT:8080}
  error:
    include-message: ${INCLUDE_ERROR:always}

secrets:
  encryption:
    key: test123
