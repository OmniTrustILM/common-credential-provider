keyStore:
  supportedTypes: PKCS12, JKS

management:
  endpoints:
    jmx:
      exposure:
        exclude: '*'
    web:
      base-path: '/'
      exposure:
        include: health, info

spring:
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///common_secret-test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: public
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

server:
  port: ${PORT:8080}
  error:
    include-message: ${INCLUDE_ERROR:always}

secrets:
  encryption:
    key: test123
